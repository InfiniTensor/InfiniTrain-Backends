name: Format Check

on:
  pull_request:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  format-check:
    name: Check Code Format
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install formatters
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install black clang-format==16.0.6

    - name: Run format check
      run: |
        python3 scripts/format.py --c clang-format --path backends --check

